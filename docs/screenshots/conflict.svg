<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520">
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="900" height="520" fill="#0f172a" opacity="0.35"/>
  <rect x="300" y="90" width="300" height="330" rx="14" fill="#ffffff" filter="url(#s)"/>

  <text x="330" y="140" font-family="Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#1f2937">Reservar: Sala de Reuniones A</text>
  <text x="330" y="162" font-family="Segoe UI, sans-serif" font-size="13" fill="#6b7280">$25 por sesión</text>

  <text x="330" y="196" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#1f2937">Fecha</text>
  <rect x="330" y="204" width="240" height="30" rx="6" fill="#fff" stroke="#d1d5db"/>
  <text x="340" y="224" font-family="Segoe UI, sans-serif" font-size="12" fill="#374151">2026-09-01</text>

  <text x="330" y="255" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#1f2937">Hora</text>
  <rect x="330" y="263" width="240" height="30" rx="6" fill="#fff" stroke="#d1d5db"/>
  <text x="340" y="283" font-family="Segoe UI, sans-serif" font-size="12" fill="#374151">10:00</text>

  <rect x="330" y="302" width="240" height="34" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="340" y="323" font-family="Segoe UI, sans-serif" font-size="11" fill="#dc2626">Ese horario ya fue reservado por</text>
  <text x="340" y="336" font-family="Segoe UI, sans-serif" font-size="11" fill="#dc2626">otra persona. Elige otro. (409)</text>

  <rect x="330" y="356" width="116" height="34" rx="8" fill="#f3f4f6"/>
  <text x="388" y="378" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#374151">Cancelar</text>
  <rect x="454" y="356" width="116" height="34" rx="8" fill="#4f46e5"/>
  <text x="512" y="378" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#fff">Confirmar</text>

  <!-- toast simulating the second user's conflict notification -->
  <rect x="640" y="24" width="240" height="46" rx="8" fill="#dc2626" filter="url(#s)"/>
  <text x="656" y="44" font-family="Segoe UI, sans-serif" font-size="11" fill="#fff" font-weight="700">Conflicto de reserva</text>
  <text x="656" y="60" font-family="Segoe UI, sans-serif" font-size="10" fill="#fee2e2">10:00 para "Sala A" ya no disponible</text>
</svg>
