<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/>
    </marker>
  </defs>
  <rect width="1000" height="360" fill="#f4f5fb"/>

  <!-- Client -->
  <rect x="40" y="110" width="220" height="140" rx="12" fill="#fff" stroke="#c7c9f5"/>
  <text x="150" y="140" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#1f2937">Cliente (Vite :5173)</text>
  <text x="150" y="165" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#6b7280">Web Components</text>
  <text x="150" y="182" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#6b7280">(Shadow DOM, sin frameworks)</text>
  <text x="150" y="205" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#4f46e5" font-weight="700">fetch() + JWT en header</text>
  <text x="150" y="225" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#9ca3af">Authorization: Bearer &lt;token&gt;</text>

  <!-- Arrow client -> server -->
  <line x1="260" y1="180" x2="380" y2="180" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="320" y="165" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#4f46e5">GET/POST/PUT/DELETE</text>
  <line x1="380" y1="210" x2="260" y2="210" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="320" y="228" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#16a34a">200 / 201 / 401 / 409 + JSON</text>

  <!-- Server -->
  <rect x="380" y="70" width="260" height="220" rx="12" fill="#fff" stroke="#c7c9f5"/>
  <text x="510" y="100" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#1f2937">API (Express :3000)</text>
  <rect x="400" y="115" width="220" height="28" rx="6" fill="#eef2ff"/>
  <text x="510" y="134" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#374151">/auth · login / register / JWT</text>
  <rect x="400" y="150" width="220" height="28" rx="6" fill="#eef2ff"/>
  <text x="510" y="169" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#374151">/bookings · CRUD + lock anti-conflicto</text>
  <rect x="400" y="185" width="220" height="28" rx="6" fill="#eef2ff"/>
  <text x="510" y="204" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#374151">/payments · confirma reserva</text>
  <rect x="400" y="220" width="220" height="28" rx="6" fill="#eef2ff"/>
  <text x="510" y="239" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#374151">/notifications · /upload · /resources</text>
  <text x="510" y="270" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#9ca3af">json-server (lowdb) como motor CRUD</text>

  <!-- Arrow server -> db -->
  <line x1="640" y1="180" x2="760" y2="180" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- DB -->
  <rect x="760" y="130" width="200" height="100" rx="12" fill="#fff" stroke="#c7c9f5"/>
  <text x="860" y="160" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#1f2937">db.json</text>
  <text x="860" y="182" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#6b7280">users · resources</text>
  <text x="860" y="200" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#6b7280">bookings · payments · notifications</text>

  <!-- Two clients race -->
  <text x="150" y="320" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#dc2626" font-weight="700">2 usuarios reservan el mismo horario →</text>
  <text x="150" y="336" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#dc2626">el servidor serializa y responde 409 al 2°</text>
</svg>
